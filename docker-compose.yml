services:
  leafguru:
    build: .
    container_name: leafguru
    restart: unless-stopped
    ports:
      - "6016:8090"
    environment:
      - LEAFGURU_DEBUG=0
      # The allowed Host names are derived automatically (localhost, this
      # machine's name and address). A wildcard would accept any Host
      # header, which is how host-header poisoning works. Set
      # LEAFGURU_ALLOWED_HOSTS to add more.
      # the database and the uploaded photos live on the volume below,
      # so rebuilding the image does not throw the data away
      - LEAFGURU_DATA_DIR=/data
    volumes:
      - leafguru-data:/data
    # The app runs as its own unprivileged user (uid 1000). The entry
    # point fixes the data volume's ownership once and then drops
    # privileges, so the caps it needs to do that are kept.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

volumes:
  leafguru-data:
