{% extends "core/base.html" %}

{% block title %}Locations — LeafGuru{% endblock %}

{% block content %}
<h1>Locations</h1>
<div class="crud-toolbar">
    <button type="button" data-crud-new>Create</button>
    <label class="task-filter">
        <span class="muted">Search</span>
        <input type="search" data-crud-search placeholder="Name, notes…">
    </label>
    <p class="muted" data-crud-flash hidden aria-live="polite"></p>
</div>
<p class="muted" data-crud-empty>No records yet.</p>
<ul class="crud-list" data-crud-list hidden></ul>

<dialog data-crud-dialog class="crud-dialog">
    <form>
        <h2 data-crud-form-title></h2>
        <div class="crud-fields"></div>
        <p class="muted crud-error" data-crud-error hidden aria-live="polite"></p>
        <div class="crud-dialog-actions">
        </div>
    </form>
</dialog>

<dialog data-location-detail class="crud-dialog">
    <form method="dialog">
        <h2 data-loc-detail-name></h2>
        <p class="muted" data-loc-detail-meta></p>
        <h3>Equipment here</h3>
        <ul data-loc-detail-equipment class="crud-list"></ul>
        <h3>Plants here</h3>
        <ul data-loc-detail-plants class="crud-list"></ul>
        <h3>Grows using this location</h3>
        <ul data-loc-detail-grows class="crud-list"></ul>
        <div class="crud-dialog-actions">
            <button type="button" data-loc-detail-close>Close</button>
        </div>
    </form>
</dialog>
{% endblock %}

{% block extra_scripts %}
<script src="/static/js/model/crud.js"></script>
<script src="/static/js/model/location-domain.js"></script>
<script src="/static/js/pages/locations.js"></script>
{% endblock %}
