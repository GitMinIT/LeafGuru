{% extends "core/base.html" %}

{% block title %}Sign in — LeafGuru{% endblock %}

{% block content %}
<div class="auth-shell">
    <section class="card auth-card">
        <h1>Sign in</h1>
        <p class="muted">LeafGuru — plan and track your grow.</p>
        {% if error %}
        <p class="crud-error" role="alert">{{ error }}</p>
        {% endif %}
        <form method="post" class="form-grid auth-form">
            {% csrf_token %}
            <label>Username or email
                <input type="text" name="username" autocomplete="username" required autofocus>
            </label>
            <label>Password
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">Sign in</button>
        </form>
        <p class="muted auth-note">
            No public sign-up — accounts are created by the service operator.
        </p>
    </section>
</div>
{% endblock %}
