{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101a17">
    <title>{% block title %}LeafGuru{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/base.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">
        <span class="brand__mark" aria-hidden="true">🌿</span>
        <span class="brand__name">LeafGuru</span>
    </a>
    <nav class="nav" aria-label="Main">
        <a href="/" data-nav="dashboard">Dashboard</a>
        <a href="/grows/" data-nav="grows">Grows</a>
        <a href="/plants/" data-nav="plants">Plants</a>
        <a href="/locations/" data-nav="locations">Locations</a>
        <a href="/equipment/" data-nav="equipment">Equipment</a>
        <a href="/strains/" data-nav="strains">Strains</a>
        <a href="/tasks/" data-nav="tasks">Tasks</a>
        <a href="/data/" data-nav="settings">Data</a>
    </nav>
</header>
<main class="page">
    {% block content %}{% endblock %}
</main>
<script>
    window.LeafGuru = window.LeafGuru || {};
    window.LeafGuru.page = document.querySelector("body").dataset.page || "";
</script>
<script src="/static/js/version.js"></script>
<script src="/static/js/model/uuid.js"></script>
<script src="/static/js/i18n/loader.js"></script>
<script src="/static/js/schemas-loader.js"></script>
<script src="/static/js/model/schema-loader.js"></script>
<script src="/static/js/model/validator.js"></script>
<script src="/static/js/adapter/storage-adapter.js"></script>
<script src="/static/js/adapter/local-adapter.js"></script>
<script src="/static/js/model/data-io.js"></script>
<script src="/static/js/model/photos.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
